<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>English · ט׳ · Sukkot</title><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{--n:#26375b;--g:#b8923c;--p:#f1ede2;--w:#fffdf8;--l:#d8d2c2;--d:74px}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:var(--p);color:var(--n);font-family:Rubik,Arial}#deck{position:fixed;inset:0 0 var(--d)}.slide{position:absolute;inset:0;padding:2vh 4vw;display:grid;place-items:center;opacity:0;pointer-events:none}.slide.on{opacity:1;pointer-events:auto}.in{width:min(1400px,100%);display:grid;gap:12px;align-content:center}.tag{color:var(--g);font-size:13px;letter-spacing:.15em;font-weight:bold}.title{margin:0;font-size:clamp(28px,4vw,58px)}.copy,.card,.hero,.answer{background:var(--w);border:1px solid var(--l);border-radius:13px;padding:12px}.copy{border-left:7px solid var(--g)}.he{direction:rtl;text-align:right;font-size:clamp(18px,1.9vw,28px);font-weight:bold}.en{font-size:clamp(18px,1.6vw,26px);font-weight:bold}.voice,.btn{border:0;border-radius:9px;background:var(--n);color:#fff;padding:8px 14px;font-weight:bold;cursor:pointer}.voice{float:right;margin-top:5px}.hero{text-align:center;border:2px solid var(--g);font-size:clamp(28px,3.7vw,55px);font-weight:bold}.gold{color:#8b671e}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.four{grid-template-columns:repeat(4,1fr)}.bank{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.bank div,.q div{background:var(--w);border:1px solid var(--l);border-radius:10px;padding:11px;font-size:clamp(17px,1.7vw,27px);font-weight:bold;text-align:center}.bank div{border-top:7px solid var(--g)}.q{display:grid;grid-template-columns:1fr 1fr;gap:9px}.read{background:var(--w);border:1px solid var(--l);border-radius:12px;padding:15px;font-size:clamp(18px,1.55vw,25px);line-height:1.42}.formula{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formula div{background:var(--n);color:#fff;border-radius:13px;padding:16px;text-align:center;font-size:clamp(21px,2.2vw,35px);font-weight:bold}.answer{display:none;background:#edf7ed;color:#17613d;text-align:center;font-size:clamp(18px,1.8vw,29px);font-weight:bold;margin-top:7px}.answer.show{display:block}.video{width:min(830px,100%);margin:auto;aspect-ratio:16/9;border:3px solid var(--g);border-radius:12px;overflow:hidden;background:#111}.video iframe,.video video{width:100%;height:100%;border:0}.backup{text-align:center;font-size:14px}#progress{position:fixed;top:0;height:5px;background:var(--g)}#bar{height:var(--d);position:fixed;bottom:0;left:0;right:0;background:#f1ede2f5;border-top:1px solid var(--l);display:flex;align-items:center;gap:12px;padding:9px 4vw}.round{width:42px;height:42px;border-radius:50%;border:1px solid var(--n);background:transparent;font-size:20px;font-weight:bold}#timer{margin-left:auto;font-size:25px;font-weight:bold}@media(max-width:800px){.grid,.q,.formula,.bank,.four{grid-template-columns:1fr}#timer{display:none}}</style></head><body><div id="progress"></div><main id="deck"></main><nav id="bar"><button class="round" id="prev">←</button><button class="round" id="next">→</button><span id="count"></span><span id="timer">—</span><button class="round" id="full">⛶</button></nav><script>
const S=[],add=(t,h,e,c,s,a)=>S.push({t,h,e,c,s,a}),R=a=>`<div class="rev"><button class="btn" onclick="one(this.parentElement)">Show answer</button> <button class="btn" onclick="all(this.parentElement)">Show all</button>${a.map(x=>`<div class="answer">✓ ${x}</div>`).join('')}</div>`,V=`<div class="video">${navigator.onLine?'<iframe src="https://www.youtube-nocookie.com/embed/2W_tjNjdCFI?rel=0" title="Past simple questions and negatives" allowfullscreen></iframe>':'<video controls preload="metadata"><source src="videos/past-simple-questions-negatives-2W_tjNjdCFI.mp4" type="video/mp4"></video>'}</div><div class="backup">Offline: <code>videos/past-simple-questions-negatives-2W_tjNjdCFI.mp4</code></div>`,V2=`<div class="video">${navigator.onLine?'<iframe src="https://www.youtube-nocookie.com/embed/UDrcktrcvL4?rel=0" title="What did you do yesterday? Past tense dialogue" allowfullscreen></iframe>':'<video controls preload="metadata"><source src="videos/past-tense-dialogue-UDrcktrcvL4.mp4" type="video/mp4"></video>'}</div><div class="backup">Offline: <code>videos/past-tense-dialogue-UDrcktrcvL4.mp4</code></div>`;
add('Mordechai · English · ט׳','יום שני, 19 באוקטובר 2026 · ט1 · ט3','Monday, 19 October 2026 · Class ט׳ (ט1 · ט3)','<div style="font-size:clamp(16px,2.2vw,26px);line-height:1.5;display:grid;grid-template-columns:1fr 1fr;gap:6px 28px;max-width:900px;margin:auto"><div><b>Today\'s agenda</b></div><div></div><div>1. Past verbs</div><div>5. Video 2</div><div>2. Video 1</div><div>6. Read, fix, answer</div><div>3. The rule</div><div>7. Exit ticket</div><div>4. Sukkot survey</div><div></div></div>',0,'');
add('Before Part 1 · Sukkot','היום מדברים על סוכות שכבר הסתיים. עובדים לבד, בשקט ובאנגלית.','Today: What did you do on Sukkot?','<div class="hero">What <span class="gold">did</span> you do on Sukkot?</div>',180,'s01');
add('Worksheet · Part 1 — Past verbs','עובדים בשקט. כתבו את צורת העבר של שמונת הפעלים.','Work silently. Write the past form of the eight verbs.','<div class="bank"><div>go → ____</div><div>eat → ____</div><div>sleep → ____</div><div>visit → ____</div><div>build → ____</div><div>see → ____</div><div>play → ____</div><div>sit → ____</div></div>'+R(['go → went','eat → ate','sleep → slept','visit → visited','build → built','see → saw','play → played','sit → sat']),300,'s02');
add('Before Part 2 · Watch','צופים פעם אחת. מקשיבים לשאלות עם Did ולשלילה עם didn’t.','Watch once. Listen for Did and didn’t.',V,180,'s03');
add('Worksheet · Part 2 — Video','עונים קצר בדף. קודם חושבים, אחר כך בודקים.','Answer briefly. Think first, then check.','<div class="q"><div>1. What word starts a past question?</div><div>2. Is the verb after did in the past?</div><div>3. I ____ eat pizza yesterday.</div></div>'+R(['1. Did','2. No. It is the base verb.','3. didn’t']),180,'s04');
add('Before Part 3 · The rule','אחרי Did או didn’t משתמשים בפועל בסיס. לא מוסיפים ed.','After Did or didn’t, use the base verb.','<div class="formula"><div>Did + <span class="gold">base verb</span><br>Did you build...?</div><div>didn’t + <span class="gold">base verb</span><br>I didn’t sleep...</div></div><div class="hero">Did you <span class="gold">build</span> a sukkah? · I didn’t <span class="gold">eat</span> in the sukkah.</div>',180,'s05');
add('Worksheet · Part 3 — Change','כתבו כל משפט בתור שאלה או שלילה. משתמשים בפועל בסיס.','Change each sentence into a question or a negative.','<div class="q"><div>1. I built a sukkah. → negative</div><div>2. You ate in the sukkah. → question</div><div>3. I slept outside. → negative</div><div>4. They visited family. → question</div><div>5. We played games. → negative</div></div>'+R(['I didn’t build a sukkah.','Did you eat in the sukkah?','I didn’t sleep outside.','Did they visit family?','We didn’t play games.']),360,'s06');
add('Before Part 4 · Sukkot survey','שואלים את החבר שיושב לידכם את שש השאלות. מסמנים את התשובה שלו, ואז כותבים משפט אחד אמיתי עליכם.','Ask your partner the six questions. Then write one true past sentence.','<div class="formula"><div>Question<br>Did you...?</div><div>Answer<br>Yes, I did. / No, I didn’t.</div></div><div class="hero">★ Fast: What did you eat?</div>',60,'s07');
add('Worksheet · Part 4 — Survey','נשארים במקום. שואלים את החבר שלידכם בקול שקט ומסמנים בדף.','Stay in your seat. Ask your partner quietly and mark the answers.','<div class="q"><div>Did you build a sukkah?</div><div>Did you eat in the sukkah?</div><div>Did you sleep in the sukkah?</div><div>Did you visit family?</div><div>Did you play games?</div><div>Did you see friends?</div></div>'+R(['Personal answers: Yes, I did. / No, I didn’t.','★ What did you eat? — I ate ...']),300,'s08');
add('Before Part 5 · Watch','צופים בדיאלוג מצויר על אתמול. סמנו או השלימו שתי תשובות בדף, ואז כתבו שתי תשובות קצרות.','Watch the animated dialogue about yesterday. Mark or complete two answers, then write two short answers.',V2,180,'s13');
add('Worksheet · Part 5 — Video','עונים על ארבע שאלות על הסרטון. קודם מסמנים או משלימים, ואז כותבים שתי תשובות קצרות.','Answer four questions about the video. Mark or complete first, then write two short answers.','<div class="q"><div>1. Choose: The first student went<br><b>□ shopping &nbsp; □ to the park</b></div><div>2. He bought new ______.</div><div>3. Who did the second student play tennis with?</div><div>4. What did the third student watch?</div></div>'+R(['1. shopping','2. clothes','3. He played tennis with Tom.','4. She watched a movie about space travel.']),180,'s14');
add('Before Part 6 · Read and fix','קוראים בשקט. יש שני פעלים לא נכונים אחרי didn’t או Did. מתקנים אותם.','Read silently. Find and fix two wrong verbs.','<div class="read"><b>Ben’s Sukkot</b><br>On Sukkot, Ben built a small sukkah with his father. They ate dinner in the sukkah every night. Ben didn’t <b>slept</b> in the sukkah because it was cold. Did he <b>visited</b> his cousins? Yes, he did. They played cards and Ben saw his friends.</div>',60,'s09');
add('Worksheet · Part 6 — Read, fix, answer','מתקנים שני פעלים ועונים בתשובה קצרה.','Fix two verbs and answer in a short phrase.','<div class="q"><div>1. Ben didn’t ______ in the sukkah.</div><div>2. Did he ______ his cousins?</div><div>3. What did Ben build?</div><div>4. What did they play?</div></div>'+R(['1. sleep','2. visit','3. A small sukkah.','4. Cards.']),180,'s10');
add('Before exit ticket · Check','בודקים: Did / didn’t + פועל בסיס. שם על הדף. מוסרים בשקט.','Check: Did / didn’t + base verb. Write your name.','<div class="grid four"><div class="card">Did?<br><b>base verb</b></div><div class="card">didn’t?<br><b>base verb</b></div><div class="card">Capital<br><b>letter</b></div><div class="card">Full stop<br><b>.</b></div></div>',60,'s11');
add('Exit ticket','עובדים לבד. משלימים ומוסרים למורה.','Complete alone. Hand in your sheet.','<div class="q"><div>1. Did you eat in the sukkah?</div><div>2. I didn’t ______ on Sukkot.</div><div>3. Write one true past sentence.</div><div>ציון __/10</div></div>'+R(['Yes, I did. / No, I didn’t.','Your own base verb.','Your own true sentence.']),180,'s12');
const deck=document.querySelector('#deck'),au=new Audio();S.forEach((s,i)=>{let x=document.createElement('section');x.className='slide';x.innerHTML=`<div class="in"><div class="tag">ENGLISH · ט׳ · CLASS 9 · MONDAY 19 OCT</div><h1 class="title">${s.t}</h1><div class="copy"><div class="he">${s.h}</div><div class="en">${s.e}</div><button class="voice" onclick="voice(${i})">🔊 עברית</button></div><div>${s.c}</div></div>`;deck.append(x);s.x=x});function one(r){let x=[...r.querySelectorAll('.answer')].find(x=>!x.classList.contains('show'));if(x)x.classList.add('show')}function all(r){r.querySelectorAll('.answer').forEach(x=>x.classList.add('show'))}function voice(i){if(!S[i].a)return;au.src='audio/'+S[i].a+'.mp3';au.play().catch(()=>alert(S[i].h))}let n=-1,timerId,rest=0,total=0;function go(i){i=Math.max(0,Math.min(S.length-1,i));if(n>=0)S[n].x.classList.remove('on');n=i;S[n].x.classList.add('on');count.textContent=`${n+1} / ${S.length}`;progress.style.width=(n+1)/S.length*100+'%';clearInterval(timerId);total=rest=S[n].s;paint();timerId=setInterval(()=>{if(rest){rest--;paint()}},1000)}function paint(){timer.textContent=total?Math.floor(rest/60)+':'+String(rest%60).padStart(2,'0'):'—'}prev.onclick=()=>go(n-1);next.onclick=()=>go(n+1);full.onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();timer.onclick=()=>{rest=rest?0:total;paint()};document.addEventListener('keydown',e=>{let r=S[n].x.querySelector('.rev');if((e.key===' '||e.key==='a'||e.key==='A')&&r&&r.querySelector('.answer:not(.show)')){one(r);e.preventDefault();return}if(['ArrowRight','PageDown',' '].includes(e.key))go(n+1);if(['ArrowLeft','PageUp'].includes(e.key))go(n-1);if(e.key==='t'||e.key==='T')timer.click();if(e.key==='f'||e.key==='F')full.click()});go(0);
</script><script>go(Math.max(0,(parseInt(location.hash.slice(1),10)||1)-1))</script></body></html>
