<!doctype html>
<html lang="en"><head><meta name="robots" content="noindex"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English · ט׳ · Ordering Food</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Rubik:wght@400;600;700&family=Secular+One&display=swap" rel="stylesheet">
<style>:root{--paper:#f2efe5;--white:#fffdf8;--ink:#1e2b47;--gold:#b58a31;--line:#d9d1be;--dock:68px}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Rubik,Arial,sans-serif}body:before{content:"";position:fixed;inset:0;opacity:.3;pointer-events:none;background-image:radial-gradient(#b9af94 1px,transparent 1px);background-size:14px 14px}#deck{position:fixed;inset:0 0 var(--dock)}.slide{position:absolute;inset:0;padding:2vh 5vw;display:grid;place-items:center;opacity:0;pointer-events:none;transition:.25s}.slide.on{opacity:1;pointer-events:auto}.inner{width:min(1440px,100%);display:grid;gap:clamp(9px,1.4vh,18px);align-content:center}.eyebrow{color:var(--gold);font-size:13px;letter-spacing:.18em;font-weight:700}.title{margin:0;color:var(--ink);font:clamp(29px,4vw,58px)/1 'Secular One',sans-serif}.copy{background:#fffdf8e9;border:1px solid var(--line);border-left:7px solid var(--gold);border-radius:12px;padding:10px 20px}.he{font:700 clamp(19px,2vw,31px)/1.2 'Frank Ruhl Libre',serif;direction:rtl;text-align:right}.en{font-size:clamp(19px,1.8vw,30px);font-weight:700;margin-top:3px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card,.panel{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:clamp(11px,1.6vw,22px);text-align:center}.card .em{font-size:clamp(34px,4vw,56px)}.card b{display:block;color:var(--ink);font:clamp(20px,2vw,31px) 'Secular One'}.card small{display:block;font-size:clamp(14px,1.2vw,20px);color:#5c7186;direction:rtl}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel h3{margin:0 0 8px;color:var(--ink);font:clamp(25px,2.5vw,38px) 'Secular One'}.panel p{font-size:clamp(17px,1.5vw,25px);line-height:1.45}.hero,.sentence{text-align:center;color:var(--ink);font:clamp(38px,5vw,78px)/1.12 'Secular One'}.sentence{background:var(--white);border:2px solid var(--gold);border-radius:15px;padding:22px}.pairs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.pairs div{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;font-size:clamp(20px,2vw,32px);font-weight:700}.pairs small{display:block;color:#5c7186;font:clamp(15px,1.3vw,21px) 'Frank Ruhl Libre';direction:rtl;margin-bottom:5px}.answer{color:#17613d;background:#edf7ed!important;border-color:#77aa80!important}.video{width:min(100%,880px,calc((100vh - 320px)*16/9));aspect-ratio:16/9;margin:auto;background:#111;border:8px solid var(--white);border-radius:14px;box-shadow:0 10px 28px #1d2a4433;overflow:hidden;position:relative}.video iframe{width:100%;height:100%;border:0;pointer-events:none}.question{font-size:clamp(24px,2.7vw,44px);font-weight:700;text-align:center;color:var(--ink)}.choice{font-size:clamp(22px,2.2vw,36px);font-weight:700;text-align:center}.button{border:0;border-radius:10px;padding:10px 17px;background:var(--ink);color:#fff;font:700 17px Rubik;cursor:pointer}.answer-key{display:none;background:#edf7ed;border:1px solid #77aa80;border-radius:12px;padding:9px;text-align:center;color:#17613d;font:clamp(23px,2.5vw,39px) 'Secular One'}.answer-key.show{display:block}.menu{font:clamp(19px,1.8vw,29px) Rubik;text-align:center;background:var(--white);border:2px dashed var(--gold);border-radius:14px;padding:16px}.dialogue{font-size:clamp(21px,2.1vw,34px);line-height:1.55;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px}.blank{display:inline-block;min-width:110px;border-bottom:3px solid var(--ink)}.exit{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.exit .card{font-size:clamp(17px,1.5vw,24px);font-weight:700}.exit .card b{font-size:30px;color:var(--gold)}#progress{position:fixed;top:0;left:0;height:5px;background:var(--gold);z-index:5;transition:.25s}#bar{height:var(--dock);position:fixed;bottom:0;left:0;right:0;z-index:4;background:#f2efe5f5;border-top:1px solid var(--line);padding:10px 4vw;display:flex;gap:12px;align-items:center}.round{width:42px;height:42px;border-radius:50%;border:1px solid var(--ink);background:transparent;font-weight:800;font-size:20px;cursor:pointer}.round:hover{background:var(--ink);color:#fff}#count{font-size:12px;font-weight:700;color:#5c7186;min-width:52px}#timer{margin-left:auto;min-width:100px;font:26px 'Secular One';color:var(--ink);cursor:pointer}.voicebtn{display:block;margin:6px 0 0 auto;border:0;border-radius:999px;background:var(--ink);color:#fff;font:700 clamp(14px,1.2vw,19px) Rubik;padding:6px 16px;cursor:pointer}.playfb{position:absolute;inset:0;margin:auto;width:84px;height:84px;border-radius:50%;border:0;background:#b58a31ee;color:#fff;font-size:40px;cursor:pointer;z-index:5}@media(max-width:850px){.grid,.pairs{grid-template-columns:repeat(2,1fr)}.exit,.two{grid-template-columns:1fr}#timer{display:none}}</style></head>
<body><div id="progress"></div><main id="deck"></main><nav id="bar"><button class="round" id="prev">←</button><button class="round" id="next">→</button><span id="count"></span><div id="timer" title="T: pause / restart">—</div><button class="round" id="full">⛶</button></nav>
<script>
const V=[{id:'PFOIk2yhznc',start:0,end:28},{id:'PFOIk2yhznc',start:28,end:56},{id:'PFOIk2yhznc',start:56,end:130}];
const S=[],add=(title,he,en,content='',sec=0,voice='')=>S.push({title,he,en,content,sec,voice});
const body=(t,h,e,c)=>`<div class="inner"><div class="eyebrow">ENGLISH · ט׳ · CLASS 8 · MONDAY 12 OCT</div><h1 class="title">${t}</h1><div class="copy"><div class="he">${h}</div><div class="en">${e}</div></div><div>${c}</div></div>`;
const cards=a=>`<div class="grid">${a.map(x=>`<div class="card"><div class="em">${x[0]}</div><b>${x[1]}</b><small>${x[2]}</small></div>`).join('')}</div>`;
const vid=n=>`<div class="video" data-vn="${n}"><div id="yt-${n}"></div></div>`;
const show=n=>`<div style="text-align:center"><button class="button" onclick="document.querySelector('#answer-${n}').classList.add('show')">Show answer</button></div>`;
add('Ordering food','היום מזמינים אוכל באנגלית.','Today we order food in English.',`<div class="sentence">ORDERING FOOD</div>`,0,'v01');
add('Silent Start · Part 1','בשקט: קוראים ומקיפים את המילה הנכונה בדף.','Silently read and circle the correct word on your sheet.',`<div class="pairs"><div><small>תפריט</small>menu / money</div><div><small>משקה</small>drink / think</div><div><small>צ׳יפס</small>fries / friends</div><div><small>להזמין</small>order / older</div><div><small>חשבון</small>bill / ball</div><div><small>כמה זה עולה?</small>How much? / How many?</div></div>`,300,'v02');
add('Food words · correction','בודקים יחד. אומרים את המילים באנגלית.','Check together. Say the English words.',`<div class="pairs">${[['תפריט','menu'],['משקה','drink'],['צ׳יפס','fries'],['להזמין','order'],['חשבון','bill'],['כמה זה עולה?','How much?']].map(x=>`<div class="answer"><small>${x[0]}</small>${x[1]}</div>`).join('')}</div>` ,0,'v03');
add('Video · three parts','רואים שלושה קטעים. אחרי כל קטע עונים בדף.','Watch three parts. Answer on your sheet after each part.',`<div class="two"><div class="panel"><h3>Watch</h3><p>Listen for food, drinks and prices.</p></div><div class="panel"><h3>Write</h3><p>Short answers are enough. Use English when you can.</p></div></div>`,0,'vwatch');
add('Video · Part 1','רואים, עוצרים, ועונים על שאלה 1 בדף.','Watch, stop, and answer question 1 on your sheet.',`${vid(0)}<div class="question">1. What does the wife want to drink?</div>${show(1)}<div id="answer-1" class="answer-key">✓ Coke</div>`,360,'vq');
add('Video · Part 2','רואים, עוצרים, ועונים על שאלה 2 במשפט קצר.','Watch, stop, and answer question 2 in a short sentence.',`${vid(1)}<div class="question">2. How many kids meals does she order?</div>${show(2)}<div id="answer-2" class="answer-key">✓ She orders two kids meals.</div>`,360,'vq');
add('Video · Part 3','רואים, עוצרים, ועונים על שאלות 3 ו־4.','Watch, stop, and answer questions 3 and 4.',`${vid(2)}<div class="question">3. The kids want burgers or nuggets?<br>4. What does the dad drink?</div><div class="choice">Bonus: What ice cream flavor?</div>${show(3)}<div id="answer-3" class="answer-key">✓ Chicken nuggets. &nbsp; ✓ He drinks lemonade.<br><span style="font:22px Rubik">Bonus: chocolate</span></div>`,420,'vq3');
add('Useful restaurant English','קוראים יחד. אחר כך משתמשים במשפטים בשיחה.','Read together. Then use the phrases in the dialogue.',`<div class="two"><div class="panel"><h3>Can I have…?</h3><p>Can I have a burger, please?</p></div><div class="panel"><h3>I’d like…</h3><p>I’d like fries and lemonade.</p></div><div class="panel"><h3>How much is it?</h3><p>How much is it, please?</p></div><div class="panel"><h3>That’s $…</h3><p>Thank you.</p></div></div>`,0,'v05');
add('At the restaurant','בוחרים אוכל, משלימים שיחה, מחשבים את הסכום.','Choose food, complete the dialogue, and add the prices.',`<div class="menu"><b>MENU</b><br>burger $5 · chicken nuggets $4 · fries $2 · lemonade $2 · orange juice $1 · ice cream $3</div><div class="dialogue"><b>Waiter:</b> What would you like?<br><b>Me:</b> Can I have <span class="blank"></span> and <span class="blank"></span>, please?<br><b>Waiter:</b> Would you like a drink?<br><b>Me:</b> I’d like <span class="blank"></span>.<br><b>Waiter:</b> That’s $ <span class="blank"></span>. <small>(add the prices)</small><br><b>★ Me:</b> How much is it?</div>`,480,'v14');
add('Exit Ticket','עונים לבד. מסמנים ציון עצמי ומוסרים את הדף.','Work alone. Mark your self-score and hand in the sheet.',`<div class="exit"><div class="card"><b>1</b>Write one food word<br><small>מילה אחת</small></div><div class="card"><b>2</b>Write one restaurant sentence<br><small>משפט אחד</small></div><div class="card"><b>3</b>Write one total: $ ___<br><small>סכום אחד</small></div></div>`,240,'v16');
add('Hand in the sheet','שם, ציון עצמי, ואז מוסרים למורה.','Name, self-score, then hand in the sheet.',`<div class="two"><div class="panel"><h3>Check</h3><p>✓ Parts 1–4<br>✓ Exit ticket<br>✓ Self-score</p></div><div class="panel"><h3>Good work!</h3><div class="hero">SEE YOU</div></div></div>`,0,'v17');
const au=new Audio();let ytReady=false,pend=null,players={},watch=null,cur=-1,tick,t={left:0,total:0};
function playVoice(i){stopClips();au.pause();const s=S[i];if(!s.voice){alert(s.he);return}au.src='audio/'+s.voice+'.mp3';au.currentTime=0;au.play().catch(()=>alert(s.he))}
const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);window.onYouTubeIframeAPIReady=()=>{ytReady=true;if(pend)pend()};
function stopClips(){clearInterval(watch);Object.values(players).forEach(p=>{try{p.pauseVideo()}catch(e){}})}
function startClip(n,id){au.pause();stopClips();const v=V[n],run=()=>{let p=players[id];const go=q=>{q.seekTo(v.start,true);q.playVideo();clearInterval(watch);watch=setInterval(()=>{try{if(q.getCurrentTime()>=v.end-.2){q.pauseVideo();clearInterval(watch)}}catch(e){}},150)};if(p&&p.seekTo)go(p);else players[id]=new YT.Player(id,{width:'100%',height:'100%',videoId:v.id,playerVars:{start:v.start,controls:0,rel:0,modestbranding:1,playsinline:1,disablekb:1,fs:0,iv_load_policy:3},events:{onReady:e=>go(e.target)}})};if(ytReady)run();else pend=run}
const deck=document.querySelector('#deck');S.forEach(s=>{const el=document.createElement('section');el.className='slide';el.innerHTML=body(s.title,s.he,s.en,s.content);deck.append(el);s.el=el;el.querySelector('.copy').insertAdjacentHTML('beforeend',`<button class="voicebtn" onclick="playVoice(${S.indexOf(s)})">🔊 עברית</button>`)});
const fmt=n=>`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;function startTimer(sec){clearInterval(tick);t={left:sec,total:sec};paint();if(sec)tick=setInterval(()=>{if(t.left){t.left--;paint()}else clearInterval(tick)},1000)}function paint(){document.querySelector('#timer').textContent=t.total?fmt(t.left):'—'}function go(i){i=Math.max(0,Math.min(S.length-1,i));if(i===cur)return;if(cur>=0)S[cur].el.classList.remove('on');cur=i;S[cur].el.classList.add('on');document.querySelector('#count').textContent=`${cur+1} / ${S.length}`;document.querySelector('#progress').style.width=`${(cur+1)/S.length*100}%`;startTimer(S[cur].sec);const vd=S[cur].el.querySelector('.video');if(vd)startClip(+vd.dataset.vn,vd.querySelector('[id^=yt-]').id);else{stopClips();au.pause()}}document.querySelector('#next').onclick=()=>go(cur+1);document.querySelector('#prev').onclick=()=>go(cur-1);document.querySelector('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.querySelector('#timer').onclick=()=>t.total&&(t.left?t.left=0:t.left=t.total,paint());document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown'].includes(e.key))go(cur+1);if(['ArrowLeft','PageUp'].includes(e.key))go(cur-1);if(e.key==='t'||e.key==='T')document.querySelector('#timer').click();if(e.key==='f'||e.key==='F')document.querySelector('#full').click()});go(Math.max(0,(parseInt(location.hash.slice(1),10)||1)-1));
</script></body></html>
